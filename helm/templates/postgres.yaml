{{- /* Init SQL scripts for per-service Postgres instances */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: {{ include "arch.namespace" . }}
data:
  auth-init.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        username VARCHAR(255) NOT NULL UNIQUE,
        password_hash VARCHAR(255) NOT NULL DEFAULT '',
        email VARCHAR(255) NOT NULL DEFAULT '',
        phone VARCHAR(50) NOT NULL DEFAULT '',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    CREATE INDEX IF NOT EXISTS idx_users_username ON users(username);
  profile-init.sql: |
    CREATE TABLE IF NOT EXISTS profile (
        profile_id    bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        userid        bigint NOT NULL,
        name          varchar(255),
        surname       varchar(255),
        date_of_birth timestamp,
        gender        varchar(20),
        city          varchar(255),
        bio           text,
        interests     text,
        CONSTRAINT uq_user UNIQUE (userid)
    );
  billing-init.sql: |
    CREATE TABLE IF NOT EXISTS billing_accounts (
        id          UUID PRIMARY KEY,
        user_id     BIGINT      NOT NULL UNIQUE,
        balance     NUMERIC(18, 2) NOT NULL DEFAULT 0,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS processed_events (
        event_id    UUID PRIMARY KEY,
        event_type  TEXT        NOT NULL,
        processed_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_billing_accounts_user_id ON billing_accounts(user_id);
  order-init.sql: |
    CREATE TABLE IF NOT EXISTS orders (
        id           UUID PRIMARY KEY,
        user_id      BIGINT         NOT NULL,
        price        DOUBLE PRECISION NOT NULL,
        status       VARCHAR(32)    NOT NULL DEFAULT 'pending',
        created_at   TIMESTAMPTZ    NOT NULL DEFAULT NOW(),
        updated_at   TIMESTAMPTZ    NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_orders_user_id ON orders(user_id);
    CREATE INDEX IF NOT EXISTS idx_orders_status  ON orders(status);
    CREATE TABLE IF NOT EXISTS processed_events (
        event_id    UUID PRIMARY KEY,
        event_type  TEXT        NOT NULL,
        processed_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS idempotency_keys (
        key          UUID PRIMARY KEY,
        order_id     UUID NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
        response     JSONB NOT NULL,
        created_at   TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_idempotency_keys_created_at ON idempotency_keys(created_at);
  notification-init.sql: |
    CREATE TABLE IF NOT EXISTS notifications (
        id           UUID PRIMARY KEY,
        user_id      BIGINT         NOT NULL,
        message       TEXT    NOT NULL,
        type VARCHAR NOT NULL,
        created_at   TIMESTAMPTZ    NOT NULL DEFAULT now(),
        updated_at   TIMESTAMPTZ    NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_notifications_user_id ON notifications(user_id);
    CREATE TABLE IF NOT EXISTS processed_events (
        event_id     UUID PRIMARY KEY,
        event_type   TEXT        NOT NULL,
        processed_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
  warehouse-init.sql: |
    CREATE TABLE IF NOT EXISTS products (
        id          BIGSERIAL PRIMARY KEY,
        name        TEXT NOT NULL,
        quantity    INTEGER NOT NULL DEFAULT 0,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS reservations (
        id          BIGSERIAL PRIMARY KEY,
        order_id    UUID NOT NULL,
        product_id  BIGINT NOT NULL REFERENCES products(id),
        quantity    INTEGER NOT NULL,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        UNIQUE (order_id, product_id)
    );
  delivery-init.sql: |
    CREATE TABLE IF NOT EXISTS couriers (
        id          BIGSERIAL PRIMARY KEY,
        name        TEXT NOT NULL,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS time_slots (
        id          BIGSERIAL PRIMARY KEY,
        courier_id  BIGINT NOT NULL REFERENCES couriers(id),
        slot_time   TIMESTAMPTZ NOT NULL,
        is_booked   BOOLEAN NOT NULL DEFAULT FALSE,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        UNIQUE (courier_id, slot_time)
    );
    CREATE TABLE IF NOT EXISTS deliveries (
        id          BIGSERIAL PRIMARY KEY,
        order_id    UUID NOT NULL UNIQUE,
        slot_id     BIGINT NOT NULL REFERENCES time_slots(id),
        courier_id  BIGINT NOT NULL REFERENCES couriers(id),
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
---
# Shared Postgres (auth)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ include "arch.namespace" . }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.defaultDB }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d/001_init.sql
              subPath: auth-init.sql
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ include "arch.namespace" . }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
